<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十一校园助手 · BNDS Campus Companion</title>
  <meta name="description" content="面向 BNDSer 的个人化校园信息中枢 —— 数据汇聚、日程驱动、AI 陪伴。" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 顶栏（移动端显示） -->
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="打开导航">☰</button>
    <div class="brand">
      <span class="brand-mark">BNDS</span>
      <span class="brand-name">十一校园助手</span>
    </div>
    <div class="topbar-user" id="topbarUser"></div>
  </header>

  <!-- 侧边导航 -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="brand-mark">BNDS</span>
      <span class="brand-name">十一校园助手</span>
    </div>
    <ul class="nav-list">
      <li><a href="#/dashboard" data-route="dashboard" class="nav-link"><span class="nav-ico">🖥️</span><span>概览 Dashboard</span></a></li>
      <li><a href="#/schedule" data-route="schedule" class="nav-link"><span class="nav-ico">📅</span><span>日程课表</span></a></li>
      <li><a href="#/focus" data-route="focus" class="nav-link"><span class="nav-ico">🎯</span><span>专注模式</span></a></li>
      <li><a href="#/mentor" data-route="mentor" class="nav-link"><span class="nav-ico">🤖</span><span>AI 辅导</span></a></li>
      <li><a href="#/life-path" data-route="life-path" class="nav-link"><span class="nav-ico">🧭</span><span>人生路径</span></a></li>
      <li><a href="#/onboarding" data-route="onboarding" class="nav-link"><span class="nav-ico">✨</span><span>Onboarding</span></a></li>
    </ul>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </nav>

  <!-- 背景遮罩（移动端） -->
  <div class="backdrop" id="backdrop"></div>

  <!-- 主内容区 -->
  <main class="main" id="main">
    <section id="view" class="view"></section>
  </main>

  <!-- Onboarding 全屏向导容器 -->
  <div id="onboardingOverlay" class="onboarding-overlay hidden"></div>

  <!-- 全局 toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
